[project]
name = "neuroclonemodel"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "io-23SklyarAnton", email = "80kap.i.toshka@gmail.com" }
]
dependencies = [
    "mlx-lm>=0.31.2",
    "pydantic>=2.13.3",
    "jinja2>=3.1.6",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "aiogram>=3.28.2",
    "dishka>=1.10.1",
    "sqlalchemy>=2.0.49",
    "psycopg2-binary>=2.9.12",
    "celery>=5.6.3",
    "redis>=8.0.0",
    "aiohttp>=3.13.5",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "peft>=0.20.0",
    "bitsandbytes>=0.50.1",
    "accelerate>=1.14.0",
    "numpy>=2.5.2",
]
readme = "README.md"
requires-python = ">=  3.12.7"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/inference_server.py",
    "src/app.py",
    "src/dependencies.py",
    "src/config.py",
    "src/constants.py",
    "src/utils.py",
    "src/handlers/*",
    "src/infrastructure/llm/mlx_engine.py",
    "src/infrastructure/llm/http_inference_engine.py",
    "src/infrastructure/celery/*",
    "src/infrastructure/db/*",
    "src/infrastructure/outbox_worker/*",
    "src/*/infrastructure/db/*",
    "src/*/infrastructure/sql/*",
    "src/*/infrastructure/local/*",
    "src/*/infrastructure/llm/*",
    "src/bot_operations/infrastructure/aiogram_bot_runner.py",
    "src/bot_operations/infrastructure/bot_reconciler.py",
    "src/bot_operations/infrastructure/dummy_bot_runner.py",
    "src/bot_operations/infrastructure/local_persona_reply_service.py",
    "src/model_engine/application/services/*",
    "src/model_engine/application/constants.py",
    "src/common/exceptions/*",
    "src/eval/*",
    "src/scripts/*",
    "src/ml_pipeline/*",
    "*/__init__.py",
    "*/i_*.py",
    "*/persona_reply_service.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/neuroclonemodel"]

[tool.rye.scripts]
infra-up = "docker compose up -d"
infra-down = "docker compose down"

bot = { cmd = "python src/app.py", env-file = ".env" }

inference-server = { cmd = "python src/inference_server.py", env-file = ".env" }

worker-cpu = { cmd = "celery -A infrastructure.celery.celery_app --workdir=src worker --pool=prefork --concurrency=4 --queues=celery --loglevel=info", env-file = ".env" }
worker-ml = { cmd = "celery -A infrastructure.celery.celery_app --workdir=src worker --pool=prefork --concurrency=2 --queues=ml --loglevel=info", env-file = ".env" }

beat = { cmd = "celery -A infrastructure.celery.celery_app --workdir=src beat --loglevel=info", env-file = ".env" }

start-all = "sh -c 'trap \"kill 0\" EXIT INT TERM; rye run inference-server & rye run bot & rye run worker-cpu & rye run worker-ml & rye run beat & wait'"

trigger = { cmd = "python src/scripts/trigger.py", env-file = ".env" }
reset = { cmd = "python src/scripts/reset.py", env-file = ".env" }
logout-main-bot = { cmd = "python src/scripts/logout_main_bot.py", env-file = ".env" }

test = { cmd = "pytest", env = { PYTHONDONTWRITEBYTECODE = "1" } }
test-cov = { cmd = "pytest --cov=src --cov-report=term-missing --cov-report=html", env = { PYTHONDONTWRITEBYTECODE = "1" } }
